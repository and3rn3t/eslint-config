# Publish @and3rn3t/eslint-config to npm (public) whenever a GitHub Release is
# published. Uses npm provenance (requires id-token: write + a public repo).
#
# Auth is npm trusted publishing (OIDC via id-token: write) — configured on
# npmjs.com for and3rn3t/eslint-config + this workflow, so no NPM_TOKEN secret.
# Publishing = bump version, push a tag, and cut a GitHub Release.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm publish --provenance
